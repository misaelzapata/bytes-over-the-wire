[package]
name = "agar-clone-server-rust"
version = "1.0.0"
edition = "2021"
description = "Classic agar.io clone authoritative game server — Rust port (tokio + tokio-tungstenite)"
license = "MIT"

[[bin]]
name = "agar-clone-server-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "fs"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"

[profile.release]
opt-level = 3
